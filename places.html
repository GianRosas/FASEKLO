<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASEKLO | Places</title>
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/places.css">
</head>

<body>
<!-- Navigation Bar -->
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                <img src="images/logo.jpg" alt="logo">
                <span>FASEKLO</span>
            </a>

            <div class="navlinks">
                <a href="index.html">Home</a>
                <a href="map.html">My map</a>
                <a href="places.html">Saved Places</a>
            </div>

            <a href="" class="secret">
                <span>Secret Spot</span>
            </a>
        </nav>
    </header>

    <main>
        <section class="saved">

            <h1>Saved Places</h1>
            <p>Your favourite places and secret spots</p>
            <div class="searching-bar">
                <img src="images/searching.jpg" alt="">
                <input type="search" class="searching" 
                    placeholder="Search your places..." aria-label="">
            </div>

            <div class="place-list">
                <article class="place-card">
                    <img class="place-img" alt="">
                    <div class="place-info">
                        <h2 class="place-name"></h2>
                        <p class="place-city"></p>
                        <div class="place-coord">
                            <span class="lat"></span>
                            <span>/</span>
                            <span class="lng"></span>
                        </div>
                        <p class="place-notes"></p>
                    </div>
                    <a class="directions"> Get Directions </a>
                </article>
            </div>
            
        </section>
    </main>

<!-- Footer Page -->    
    <footer>
        <div class="footer-content">
            <div class="brand">
                <a>FASEKLO</a>
                <p>Discover, Save, Return</p>
            </div>

            <div class="developers">
                <p>DEVELOPED BY</p>
                <p>Gian Rosas & Anshika Sharma</p>
                <p>Okanagan College - BCIS</p>
            </div>
        </div>

        <div class="footer-bottom">
            <p>© 2026 FASEKLO. All rights reserved.</p>
            <p>By explores, for explores</p>
        </div>
    </footer>
</body>
</html>
